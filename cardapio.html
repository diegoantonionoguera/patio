<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  <title>El Patio</title>
  <style>
    :root {
      color-scheme: light;
      color: #23211f;
      background: #f7f4ef;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at top left, rgba(59, 50, 44, 0.08), transparent 34%),
                  linear-gradient(180deg, #fefbf7 0%, #f3efe8 100%);
      color: #23211f;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(16px, 3vw, 24px);
      min-height: 100vh;
      overflow-y: auto;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('imagens/Fundo.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.12;
      pointer-events: none;
      z-index: -1;
    }

    .container {
      width: min(100%, 760px);
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 24px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(59, 50, 44, 0.12);
      border-radius: 32px;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(12px);
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
    }

    .topbar h1 {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 4vw, 2.7rem);
      line-height: 1.05;
      letter-spacing: 0.02em;
    }

    .page-intro {
      margin: 0;
      max-width: 620px;
      color: #59514b;
      font-size: clamp(1rem, 2vw, 1.18rem);
      line-height: 1.8;
      font-style: italic;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 22px;
      border-radius: 18px;
      background: #3b322c;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 14px 32px rgba(59, 50, 44, 0.18);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .back-link:hover {
      transform: translateY(-2px);
      background: #27211a;
    }

    .document-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    .viewer {
      width: 100%;
      border-radius: 28px;
      overflow: hidden;
      background: #111;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .viewer iframe {
      width: 100%;
      min-height: clamp(540px, 72vh, 840px);
      border: 0;
      display: block;
    }

    .fallback {
      padding: 18px 20px;
      border-radius: 20px;
      background: rgba(247, 244, 239, 0.95);
      border: 1px solid rgba(59, 50, 44, 0.12);
      color: #3d342d;
      font-size: clamp(0.95rem, 1.8vw, 1.05rem);
      line-height: 1.7;
    }

    .fallback a {
      color: #3b322c;
      text-decoration: underline;
      font-weight: 700;
    }

    @media (max-width: 768px) {
      .container {
        padding: 18px;
      }

      .topbar {
        flex-direction: column;
      }

      .viewer iframe {
        min-height: 380px;
      }
    }
  </style>
</head>
<body>
  <div class="container page-container">
    <div class="topbar">
      <div>
        <h1>Cardápio El Patio</h1>
        <p class="page-intro">Explore nosso menu premium de parrilla, vinos e empanadas em uma experiência digital elegante.</p>
      </div>
      <a href="index.html" class="back-link">Voltar</a>
    </div>

    <section class="document-panel">
      <div class="viewer">
        <iframe src="Cardápio.pdf" title="Cardápio El Patio"></iframe>
      </div>

      <div class="fallback">
        <p>Seu navegador não consegue exibir o PDF diretamente.</p>
        <p><a href="Cardápio.pdf" target="_blank" rel="noopener noreferrer">Abra o cardápio em outra aba.</a></p>
      </div>
    </section>
  </div>
</body>
</html>
